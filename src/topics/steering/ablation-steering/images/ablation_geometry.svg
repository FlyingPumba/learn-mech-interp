<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Ablation as an orthogonal projection</title>
  <desc id="desc">The activation h is projected onto the hyperplane perpendicular to direction r, leaving h perpendicular and removing its component along r.</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2457a6"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="18" fill="#ffffff"/>
  <g stroke="#e6e9ef" stroke-width="1">
    <path d="M70 80H740M70 150H740M70 220H740M70 290H740M70 360H740"/>
    <path d="M120 45V375M240 45V375M360 45V375M480 45V375M600 45V375M720 45V375"/>
  </g>
  <line x1="116" y1="340" x2="700" y2="108" stroke="#64748b" stroke-width="4"/>
  <text x="574" y="75" font-family="system-ui, sans-serif" font-size="17" fill="#475569">hyperplane orthogonal to r</text>
  <line x1="332" y1="254" x2="525" y2="332" stroke="#6d28d9" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="505" y="359" font-family="Georgia, serif" font-size="25" font-style="italic" fill="#6d28d9">r</text>
  <line x1="332" y1="254" x2="570" y2="159" stroke="#2457a6" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line x1="570" y1="159" x2="456" y2="205" stroke="#b45309" stroke-width="4" stroke-dasharray="8 7"/>
  <circle cx="332" cy="254" r="8" fill="#172554"/>
  <circle cx="456" cy="205" r="10" fill="#0f766e" stroke="#ffffff" stroke-width="3"/>
  <circle cx="570" cy="159" r="10" fill="#2457a6" stroke="#ffffff" stroke-width="3"/>
  <text x="581" y="153" font-family="Georgia, serif" font-size="25" font-style="italic" fill="#2457a6">h</text>
  <text x="420" y="190" font-family="Georgia, serif" font-size="23" font-style="italic" fill="#0f766e">h⊥</text>
  <text x="509" y="199" font-family="system-ui, sans-serif" font-size="15" fill="#92400e">removed component</text>
  <path d="M448 188 L463 181 L471 197" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="400" y="397" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#475569">Ablation keeps the projection h⊥ and removes the component parallel to r.</text>
</svg>
