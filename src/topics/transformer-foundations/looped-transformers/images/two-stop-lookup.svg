<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-labelledby="title desc">
  <title id="title">One attention head follows two train connections</title>
  <desc id="desc">Rows are passes through the same head at the final question position. Columns are timetable entries. The first pass queries Oak and reads Oak to Bay. The second queries Bay and reads Bay to Elm.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #243b44; text-anchor: middle; }
    .heading { font-size: 20px; font-weight: 650; }
    .entry { font-size: 18px; font-weight: 550; }
    .pass { font-size: 15px; font-weight: 600; fill: #526568; }
    .station { font-size: 21px; font-weight: 650; }
    .read { font-size: 17px; font-weight: 600; fill: #fff; }
    .quiet { fill: #f0f1ed; stroke: #d6ddda; }
    .active { fill: #17695f; }
  </style>
  <rect x="1" y="1" width="558" height="270" rx="14" fill="#fbfaf6" stroke="#d7deda"/>
  <text x="268" y="36" class="heading">Connections in the prompt</text>
  <path d="M114 48h306" stroke="#bccac6"/>
  <g class="entry">
    <text x="63" y="81">Query</text>
    <text x="159" y="81">Bay → Elm</text>
    <text x="267" y="81">Fir → Ash</text>
    <text x="375" y="81">Oak → Bay</text>
    <text x="491" y="81">Retrieves</text>
  </g>
  <g>
    <rect class="quiet" x="108" y="99" width="102" height="55" rx="7"/>
    <rect class="quiet" x="216" y="99" width="102" height="55" rx="7"/>
    <rect class="active" x="324" y="99" width="102" height="55" rx="7"/>
    <text class="pass" x="60" y="117">Pass 1</text>
    <text class="station" x="60" y="144">Oak</text>
    <text class="read" x="375" y="133">Read</text>
    <text class="station" x="491" y="135">Bay</text>
  </g>
  <path d="M491 146v19q0 6-6 6H66q-6 0-6 6v7m-4-5 4 5 4-5" fill="none" stroke="#8b6a40" stroke-width="2"/>
  <g>
    <rect class="active" x="108" y="190" width="102" height="55" rx="7"/>
    <rect class="quiet" x="216" y="190" width="102" height="55" rx="7"/>
    <rect class="quiet" x="324" y="190" width="102" height="55" rx="7"/>
    <text class="pass" x="60" y="208">Pass 2</text>
    <text class="station" x="60" y="235">Bay</text>
    <text class="read" x="159" y="224">Read</text>
    <text class="station" x="491" y="226">Elm</text>
  </g>
</svg>
